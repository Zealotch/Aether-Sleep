<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Power Timer - Aether Sleep</title>
    <link rel="icon" type="image/x-icon" href="/icon.ico">
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script type="text/javascript" src="/eel.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#dbfcff",
                        "primary-fixed-dim": "#00dbe9",
                        secondary: "#d0bcff",
                        "on-surface-variant": "#b9cacb"
                    },
                    fontFamily: {
                        "headline-md": ["Sora"],
                        "label-caps": ["Geist"],
                        "display-timer": ["Sora"],
                        "label-md": ["Geist"]
                    },
                    backgroundImage: {
                        'cosmic-gradient': 'radial-gradient(circle at 50% 0%, #1E293B 0%, #020617 70%)',
                        'button-gradient': 'linear-gradient(135deg, rgba(0,219,233,1) 0%, rgba(87,27,193,1) 100%)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: #d4e4fa; }
        .glass-panel-1 {
            background-color: rgba(30, 41, 59, 0.4); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-panel-2 {
            background-color: rgba(30, 41, 59, 0.6); backdrop-filter: blur(40px); border: 1px solid rgba(0, 219, 233, 0.2);
        }
        .glow-ambient { box-shadow: 0 10px 40px -10px rgba(0, 219, 233, 0.15); }
        .glow-active { box-shadow: 0 0 20px rgba(0, 219, 233, 0.4); }
        .timer-ring { stroke-dasharray: 880; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
        
        #custom-titlebar { -webkit-app-region: drag; }
        #custom-titlebar button { -webkit-app-region: no-drag; }

        .light-mode { background-color: #f0f4f8; color: #334155; }
        .light-mode.bg-cosmic-gradient { background-image: radial-gradient(circle at 50% 0%, #e2e8f0 0%, #f8fafc 70%); }
        .light-mode .glass-panel-1 { background-color: rgba(255, 255, 255, 0.7); border: 1px solid rgba(0, 0, 0, 0.1); }
        .light-mode .glass-panel-2 { background-color: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0, 219, 233, 0.4); }
        .light-mode .timer-ring { stroke: #0ea5e9; }
        .light-mode .text-primary { color: #0284c7; }
        .light-mode .text-primary-fixed-dim { color: #0369a1; }
        .light-mode .text-on-surface-variant { color: #475569; }
        .light-mode input, .light-mode select { background-color: rgba(255, 255, 255, 0.5); border-color: rgba(0, 0, 0, 0.1); color: #0f172a; }
        .light-mode #history-modal > div { background-color: #f8fafc; border-color: #cbd5e1; }
        .light-mode .border-b { border-color: rgba(0,0,0,0.1); }
        .light-mode .bg-\[\#1E293B\]\/50 { background-color: rgba(255,255,255,0.8); }
        .light-mode .bg-\[\#1E293B\]\/30 { background-color: rgba(255,255,255,0.6); }
    </style>
</head>
<body class="bg-cosmic-gradient h-screen w-screen overflow-hidden flex flex-col relative select-none">

<!-- Particle Canvas -->
<canvas id="particle-canvas" class="absolute inset-0 pointer-events-none z-0"></canvas>

<main class="flex-1 flex flex-col md:flex-row items-center justify-center relative w-full max-w-5xl mx-auto gap-12 p-4 z-10 overflow-y-auto">
    
    <!-- Header Controls -->
    <div class="fixed top-12 left-6 z-50">
        <button id="history-btn" class="glass-panel-1 p-2 rounded-lg hover:text-primary transition-all flex items-center justify-center hover:border-primary/50 text-on-surface-variant" title="Insights & Riwayat">
            <span class="material-symbols-outlined text-[20px]">bar_chart</span>
        </button>
    </div>
    <div class="fixed top-12 right-6 z-50">
        <button id="theme-btn" class="glass-panel-1 p-2 rounded-lg hover:text-primary transition-all flex items-center justify-center hover:border-primary/50 text-on-surface-variant" title="Ubah Tema">
            <span class="material-symbols-outlined text-[20px]" id="theme-icon">light_mode</span>
        </button>
    </div>

    <!-- History/Insights Modal -->
    <div id="history-modal" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel-2 rounded-2xl w-[90%] max-w-lg max-h-[85vh] flex flex-col overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300 relative">
            <div class="p-5 border-b border-white/10 flex items-center justify-between bg-[#1E293B]/50">
                <h2 class="font-headline-md text-primary text-lg tracking-wide flex items-center gap-2">
                    <span class="material-symbols-outlined text-[20px]">insights</span>
                    Dashboard Penghematan
                </h2>
                <button id="close-history" class="text-on-surface-variant hover:text-white transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <!-- Dashboard Stats Container (Populated by JS) -->
            <div id="dashboard-stats" class="p-5 border-b border-white/5 grid grid-cols-3 gap-3 bg-[#1E293B]/30">
                <!-- Stats injected here -->
            </div>
            
            <div class="px-5 pt-4 pb-2 border-b border-white/5">
                <h3 class="text-[11px] font-semibold text-primary-fixed-dim uppercase tracking-widest">Riwayat Aktivitas</h3>
            </div>
            
            <div class="p-5 overflow-y-auto flex-1 flex flex-col gap-3" id="history-list">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <!-- Left Side: Timer Area -->
    <div class="flex flex-col items-center justify-center flex-1">
        <!-- Title -->
        <div class="mb-6 text-center w-full">
            <h1 class="font-headline-md text-[32px] text-primary tracking-wide">Power Timer</h1>
            <p class="text-on-surface-variant mt-1 text-[13px]">Aether Sleep Desktop Edition</p>
        </div>
        
        <!-- Circular Timer -->
        <div class="relative w-[320px] h-[320px] flex items-center justify-center mb-4">
            <svg class="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 300 300">
                <circle cx="150" cy="150" fill="none" opacity="0.5" r="140" stroke="#1E293B" stroke-width="6"></circle>
                <circle class="timer-ring glow-ambient" cx="150" cy="150" fill="none" r="140" stroke="#00dbe9" stroke-width="6"></circle>
            </svg>
            <div class="flex flex-col items-center z-10" id="pulse-ring" style="animation-duration: 4s;">
                <span class="font-display-timer text-[64px] text-primary tracking-tighter leading-none" id="display-timer">45:00</span>
                <span class="font-label-caps text-[12px] text-primary-fixed-dim mt-2 tracking-widest uppercase opacity-80" id="status-label">Ready</span>
            </div>
        </div>
    </div>

    <!-- Right Side: Controls Area -->
    <div class="flex flex-col items-center justify-center gap-6 flex-1 max-w-[400px] w-full">
        
        <!-- Quick Presets -->
        <div class="w-full">
            <p class="text-[12px] text-primary-fixed-dim uppercase tracking-wider mb-3 text-center">Quick Presets</p>
            <div class="flex flex-wrap gap-2 justify-center w-full" id="preset-buttons">
                <!-- Dynamically populated from python -->
            </div>
            <p class="text-[11px] text-on-surface-variant/50 mt-2 text-center">Klik kanan preset untuk menghapus</p>
        </div>

        <!-- Custom Input & Action Selection -->
        <div class="w-full flex flex-col gap-4">
            <div class="flex items-center gap-2 w-full">
                <input type="number" id="custom-minutes" placeholder="Menit custom..." class="flex-1 bg-[#1E293B]/50 border border-white/10 rounded-lg px-4 py-[10px] text-white focus:outline-none focus:border-primary-fixed-dim transition-colors text-sm" min="1" max="999">
                <button id="add-preset-btn" class="glass-panel-1 p-[10px] rounded-lg hover:text-primary transition-all flex items-center justify-center hover:border-primary/50" title="Simpan sebagai Preset">
                    <span class="material-symbols-outlined text-[18px]">add</span>
                </button>
            </div>
            
            <div class="relative w-full">
                <select id="action-select" class="w-full bg-[#1E293B]/50 border border-white/10 rounded-lg px-4 py-[10px] text-white focus:outline-none focus:border-primary-fixed-dim transition-colors appearance-none text-sm cursor-pointer">
                    <option value="hibernate_timer">Hibernate (Timer)</option>
                    <option value="hibernate_smart">Hibernate (Smart Trigger)</option>
                    <option value="shutdown_timer">Shutdown (Timer)</option>
                    <option value="shutdown_smart">Shutdown (Smart Trigger)</option>
                </select>
                <span class="material-symbols-outlined absolute right-3 top-1/2 transform -translate-y-1/2 text-on-surface-variant pointer-events-none text-[18px]">expand_more</span>
            </div>
            
            <!-- Smart Trigger Panel (Hidden by default) -->
            <div id="smart-trigger-panel" class="w-full bg-[#1E293B]/30 border border-primary-fixed-dim/30 p-3 rounded-lg hidden flex-col gap-3">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary-fixed-dim text-[16px]">memory</span>
                    <span class="text-xs text-primary-fixed-dim font-semibold uppercase tracking-wider">Smart Trigger</span>
                </div>
                <div class="flex gap-2">
                    <select id="smart-type" class="flex-1 bg-[#1E293B]/50 border border-white/10 rounded-lg px-2 py-1.5 text-white focus:outline-none focus:border-primary-fixed-dim transition-colors appearance-none text-xs cursor-pointer">
                        <option value="network">Network (< KB/s)</option>
                        <option value="cpu">CPU (< %)</option>
                        <option value="battery">Battery Level (< %)</option>
                    </select>
                    <input type="number" id="smart-threshold" placeholder="Batas..." value="50" class="w-[80px] bg-[#1E293B]/50 border border-white/10 rounded-lg px-2 py-1.5 text-white focus:outline-none focus:border-primary-fixed-dim transition-colors text-xs" min="1" max="999">
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-on-surface-variant flex-shrink-0">Durasi Stabil:</span>
                    <input type="number" id="smart-duration" placeholder="Menit" value="5" class="w-[60px] bg-[#1E293B]/50 border border-white/10 rounded-lg px-2 py-1 text-white focus:outline-none focus:border-primary-fixed-dim transition-colors text-xs text-center" min="1" max="999">
                    <span class="text-xs text-on-surface-variant">menit</span>
                </div>
            </div>
        </div>

        <!-- Keep Awake Toggle -->
        <div class="w-full flex items-center gap-3 bg-[#1E293B]/30 border border-white/5 p-3 rounded-lg hover:bg-[#1E293B]/50 transition-colors cursor-pointer" onclick="document.getElementById('keep-awake').click()">
            <input type="checkbox" id="keep-awake" class="rounded border-white/20 bg-transparent text-primary-fixed-dim focus:ring-primary-fixed-dim focus:ring-offset-0 cursor-pointer" checked onclick="event.stopPropagation()">
            <label for="keep-awake" class="text-[13px] text-on-surface-variant cursor-pointer select-none">Cegah PC tertidur sebelum waktunya.</label>
        </div>

        <!-- Start Button -->
        <button id="start-btn" class="w-full py-4 rounded-full bg-button-gradient text-white font-headline-md text-[18px] font-semibold tracking-wide hover:scale-[1.02] transition-transform duration-300 glow-active mt-2">
            Start Sleep
        </button>
    </div>

</main>

<script>
    let countdownInterval;
    let targetTime = null;
    let currentMinutes = 45;

    const displayTimer = document.getElementById('display-timer');
    const startBtn = document.getElementById('start-btn');
    const statusLabel = document.getElementById('status-label');
    const pulseRing = document.getElementById('pulse-ring');
    const presetContainer = document.getElementById('preset-buttons');
    const ring = document.querySelector('.timer-ring');
    const customMinutesInput = document.getElementById('custom-minutes');
    const addPresetBtn = document.getElementById('add-preset-btn');
    const actionSelect = document.getElementById('action-select');
    const keepAwakeCheck = document.getElementById('keep-awake');
    
    const smartTriggerPanel = document.getElementById('smart-trigger-panel');
    const smartType = document.getElementById('smart-type');
    const smartThreshold = document.getElementById('smart-threshold');
    const smartDuration = document.getElementById('smart-duration');

    actionSelect.addEventListener('change', () => {
        if (actionSelect.value.includes('_smart')) {
            smartTriggerPanel.classList.remove('hidden');
            smartTriggerPanel.classList.add('flex');
            customMinutesInput.parentElement.classList.add('hidden'); // hide normal timer input
            presetContainer.parentElement.classList.add('hidden'); // hide presets
        } else {
            smartTriggerPanel.classList.add('hidden');
            smartTriggerPanel.classList.remove('flex');
            customMinutesInput.parentElement.classList.remove('hidden');
            presetContainer.parentElement.classList.remove('hidden');
        }
    });

    const historyBtn = document.getElementById('history-btn');
    const closeHistoryBtn = document.getElementById('close-history');
    const historyModal = document.getElementById('history-modal');
    const historyList = document.getElementById('history-list');

    // Theme Toggle Logic
    const themeBtn = document.getElementById('theme-btn');
    const themeIcon = document.getElementById('theme-icon');
    themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        themeIcon.innerText = document.body.classList.contains('light-mode') ? 'dark_mode' : 'light_mode';
    });

    // History Modal Logic
    historyBtn.addEventListener('click', async () => {
        historyModal.classList.remove('hidden');
        // Small delay to allow display block to apply before opacity transition
        setTimeout(() => {
            historyModal.classList.remove('opacity-0');
            historyModal.querySelector('div').classList.remove('scale-95');
            historyModal.querySelector('div').classList.add('scale-100');
        }, 10);
        
        const dashboardStats = document.getElementById('dashboard-stats');
        dashboardStats.innerHTML = '<div class="text-center py-4 text-on-surface-variant/50 text-sm col-span-3">Memuat statistik...</div>';
        historyList.innerHTML = '<div class="text-center py-4 text-on-surface-variant/50 text-sm">Memuat riwayat...</div>';
        
        try {
            const logs = await eel.get_history()();
            const stats = await eel.get_stats()();
            
            dashboardStats.innerHTML = `
                <div class="bg-primary/5 rounded-xl p-3 border border-white/5 flex flex-col items-center justify-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <span class="material-symbols-outlined text-[24px] text-primary mb-1">power_settings_new</span>
                    <div class="text-2xl font-headline-md font-bold text-white leading-none">${stats.hibernations}</div>
                    <div class="text-[10px] uppercase tracking-widest text-on-surface-variant mt-1">Siklus Tidur</div>
                </div>
                <div class="bg-primary/5 rounded-xl p-3 border border-white/5 flex flex-col items-center justify-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-blue-400/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <span class="material-symbols-outlined text-[24px] text-blue-400 mb-1">schedule</span>
                    <div class="text-2xl font-headline-md font-bold text-white leading-none">${stats.hours_saved}</div>
                    <div class="text-[10px] uppercase tracking-widest text-on-surface-variant mt-1">Jam Dihemat</div>
                </div>
                <div class="bg-primary/5 rounded-xl p-3 border border-white/5 flex flex-col items-center justify-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-br from-green-400/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <span class="material-symbols-outlined text-[24px] text-green-400 mb-1">eco</span>
                    <div class="text-2xl font-headline-md font-bold text-white leading-none">${stats.kwh_saved}</div>
                    <div class="text-[10px] uppercase tracking-widest text-on-surface-variant mt-1">kWh Dihemat</div>
                </div>
            `;
            
            if (logs.length === 0) {
                historyList.innerHTML += '<div class="text-center py-4 text-on-surface-variant/50 text-sm">Tidak ada riwayat.</div>';
                return;
            }
            // Reverse so newest is top
            logs.reverse().forEach(log => {
                const dateObj = new Date(log.time);
                const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = dateObj.toLocaleDateString([], { day: '2-digit', month: 'short' });
                
                const item = document.createElement('div');
                item.className = "flex gap-3 items-start border-b border-white/5 pb-3 last:border-0";
                item.innerHTML = `
                    <div class="text-[10px] text-primary-fixed-dim bg-primary-fixed-dim/10 px-2 py-1 rounded whitespace-nowrap mt-0.5">
                        ${timeStr}
                    </div>
                    <div class="flex-1 flex flex-col">
                        <span class="text-[13px] text-white leading-snug">${log.message}</span>
                        <span class="text-[10px] text-on-surface-variant/50 mt-0.5">${dateStr}</span>
                    </div>
                `;
                historyList.appendChild(item);
            });
        } catch (e) {
            historyList.innerHTML = '<div class="text-center py-4 text-red-400/80 text-sm">Gagal memuat riwayat.</div>';
        }
    });

    closeHistoryBtn.addEventListener('click', () => {
        historyModal.classList.add('opacity-0');
        historyModal.querySelector('div').classList.remove('scale-100');
        historyModal.querySelector('div').classList.add('scale-95');
        setTimeout(() => {
            historyModal.classList.add('hidden');
        }, 300);
    });

    historyModal.addEventListener('click', (e) => {
        if (e.target === historyModal) {
            closeHistoryBtn.click();
        }
    });

    function updateDisplay(m, s) {
        displayTimer.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function setDuration(m) {
        if(targetTime) return; 
        currentMinutes = m;
        updateDisplay(m, 0);
        
        // Highlight active preset
        const btns = document.querySelectorAll('.preset-btn');
        btns.forEach(btn => {
            if(parseInt(btn.innerText) === m) {
                btn.className = "preset-btn glass-panel-2 px-5 py-2 rounded-full font-label-md text-primary border-primary-fixed-dim transition-all shadow-[0_0_15px_rgba(0,219,233,0.2)]";
            } else {
                btn.className = "preset-btn glass-panel-1 px-5 py-2 rounded-full font-label-md text-on-surface-variant hover:text-primary hover:border-primary/50 transition-all";
            }
        });
        
        ring.style.strokeDashoffset = 0; // reset ring to full visually
    }

    function renderPresets(presets) {
        presetContainer.innerHTML = '';
        presets.forEach(minutes => {
            const btn = document.createElement('button');
            btn.className = "preset-btn glass-panel-1 px-5 py-2 rounded-full font-label-md text-on-surface-variant hover:text-primary hover:border-primary/50 transition-all";
            btn.innerText = `${minutes}m`;
            
            // Left click to select
            btn.addEventListener('click', () => setDuration(minutes));
            
            // Right click to remove
            btn.addEventListener('contextmenu', async (e) => {
                e.preventDefault();
                if(targetTime) return;
                const newPresets = await eel.remove_preset(minutes)();
                renderPresets(newPresets);
            });
            
            presetContainer.appendChild(btn);
        });
        // Set initial duration to the first preset if exists, else 45
        if(presets.length > 0 && !targetTime) {
            setDuration(presets[0]);
        } else if (presets.length === 0 && !targetTime) {
            setDuration(45);
        }
    }

    customMinutesInput.addEventListener('input', (e) => {
        if(targetTime) return;
        const val = parseInt(e.target.value);
        if(!isNaN(val) && val > 0) {
            setDuration(val);
        }
    });

    addPresetBtn.addEventListener('click', async () => {
        if(targetTime) return;
        const val = parseInt(customMinutesInput.value);
        if(!isNaN(val) && val > 0) {
            const newPresets = await eel.add_preset(val)();
            renderPresets(newPresets);
            customMinutesInput.value = '';
        }
    });

    eel.expose(sync_cancel_from_backend);
    function sync_cancel_from_backend() {
        if (targetTime) {
            clearInterval(countdownInterval);
            targetTime = null;
            startBtn.innerText = "Start Sleep";
            statusLabel.innerText = "Ready";
            pulseRing.classList.remove('animate-pulse');
            document.querySelectorAll('.preset-btn').forEach(b => b.disabled = false);
            customMinutesInput.disabled = false;
            addPresetBtn.disabled = false;
            actionSelect.disabled = false;
            keepAwakeCheck.disabled = false;
            smartType.disabled = false;
            smartThreshold.disabled = false;
            smartDuration.disabled = false;
        }
    }

    async function toggleSleep() {
        if (targetTime) {
            // Cancel
            await eel.cancel()();
            clearInterval(countdownInterval);
            targetTime = null;
            startBtn.innerText = "Start Sleep";
            statusLabel.innerText = "Ready";
            pulseRing.classList.remove('animate-pulse');
            ring.style.strokeDashoffset = 0;
            setDuration(currentMinutes);
            
            // Re-enable inputs
            customMinutesInput.disabled = false;
            actionSelect.disabled = false;
            keepAwakeCheck.disabled = false;
            addPresetBtn.disabled = false;
            smartType.disabled = false;
            smartThreshold.disabled = false;
            smartDuration.disabled = false;
        } else {
            // Start
            let selectedAction = actionSelect.value;
            let mode = "timer";
            let baseAction = selectedAction.replace('_timer', '').replace('_smart', '');
            
            if (selectedAction.includes("_smart")) {
                mode = "smart";
            }
            
            const prevent = keepAwakeCheck.checked;
            const res = await eel.schedule(
                currentMinutes, 
                baseAction, 
                prevent, 
                mode,
                smartType.value,
                smartThreshold.value,
                smartDuration.value
            )();
            
            if (res.status === "success") {
                targetTime = mode === "timer" ? new Date(res.target_time) : "smart";
                startBtn.innerText = "Cancel Sleep";
                statusLabel.innerText = `${baseAction.toUpperCase()} IN`;
                pulseRing.classList.add('animate-pulse');
                
                // Disable inputs
                customMinutesInput.disabled = true;
                actionSelect.disabled = true;
                keepAwakeCheck.disabled = true;
                addPresetBtn.disabled = true;
                smartType.disabled = true;
                smartThreshold.disabled = true;
                smartDuration.disabled = true;
                
                if (mode === "timer") {
                    const totalSecondsStart = currentMinutes * 60;
    
                    countdownInterval = setInterval(() => {
                        const now = new Date();
                        const diff = targetTime - now;
                        if (diff <= 0) {
                            clearInterval(countdownInterval);
                            targetTime = null;
                            eel.execute_action(baseAction)();
                        } else {
                            const totalSeconds = Math.floor(diff / 1000);
                            const m = Math.floor(totalSeconds / 60);
                            const s = totalSeconds % 60;
                            updateDisplay(m, s);
                            
                            // Calculate percentage remaining (1.0 to 0.0)
                            const pct = totalSeconds / totalSecondsStart;
                            ring.style.strokeDashoffset = 880 - (880 * pct);
                        }
                    }, 1000);
                } else {
                    // Smart mode visual
                    displayTimer.innerText = "SMART";
                    statusLabel.innerText = "MONITORING " + smartType.value.toUpperCase();
                    ring.style.strokeDashoffset = 0; // Filled visually to indicate active tracking
                }
            }
        }
    }

    startBtn.addEventListener('click', toggleSleep);

    async function initialize() {
        try {
            // Check if there is an existing schedule running
            const existing = await eel.check_existing_schedule()();
            
            if (existing) {
                    // Sync UI to active state
                    let baseAction = existing.action;
                    if (existing.mode === "timer" && existing.target_time) {
                        targetTime = new Date(existing.target_time);
                        // Calculate remaining minutes for display initialization
                        const now = new Date();
                        const diff = targetTime - now;
                        currentMinutes = Math.max(1, Math.ceil(diff / 60000));
                        
                        const totalSecondsStart = currentMinutes * 60;
                        
                        countdownInterval = setInterval(() => {
                            const now = new Date();
                            const diff = targetTime - now;
                            if (diff <= 0) {
                                clearInterval(countdownInterval);
                                targetTime = null;
                                eel.execute_action(baseAction)();
                            } else {
                                const totalSeconds = Math.floor(diff / 1000);
                                const m = Math.floor(totalSeconds / 60);
                                const s = totalSeconds % 60;
                                updateDisplay(m, s);
                                
                                const pct = totalSeconds / totalSecondsStart;
                                ring.style.strokeDashoffset = 880 - (880 * pct);
                            }
                        }, 1000);
                    } else {
                        targetTime = "smart";
                        displayTimer.innerText = "SMART";
                        
                        // set selects based on config
                        if (existing.smart_config) {
                            smartType.value = existing.smart_config.type || "network";
                            smartThreshold.value = existing.smart_config.threshold || 50;
                            smartDuration.value = (existing.smart_config.duration / 60) || 5;
                        }
                        actionSelect.value = baseAction + "_smart";
                        actionSelect.dispatchEvent(new Event('change'));
                        
                        statusLabel.innerText = "MONITORING " + smartType.value.toUpperCase();
                        ring.style.strokeDashoffset = 0;
                    }
                    
                    startBtn.innerText = "Cancel Sleep";
                    statusLabel.innerText = `${baseAction.toUpperCase()} IN`;
                    pulseRing.classList.add('animate-pulse');
                    
                    // Disable inputs
                    customMinutesInput.disabled = true;
                    actionSelect.disabled = true;
                    keepAwakeCheck.disabled = true;
                    addPresetBtn.disabled = true;
                    smartType.disabled = true;
                    smartThreshold.disabled = true;
                    smartDuration.disabled = true;
                    
                    // Render presets but they will be non-clickable visually
                    const presets = await eel.get_presets()();
                    renderPresets(presets);
                    
                } else {
                    statusLabel.innerText = "Ready";
                    pulseRing.classList.remove('animate-pulse');
                    const presets = await eel.get_presets()();
                    renderPresets(presets);
                }
            } catch (e) {
                console.error(e);
                renderPresets([15, 30, 45, 60]);
            }
    }
    
    // Listen for Eel ready (Eel doesn't have a specific ready event, DOMContentLoaded is sufficient)
    window.addEventListener("DOMContentLoaded", initialize);
    
    // Live Wallpaper Particle Effect
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedY = Math.random() * -0.5 - 0.1;
            this.speedX = (Math.random() - 0.5) * 0.2;
            this.opacity = Math.random() * 0.5 + 0.1;
        }
        update() {
            this.y += this.speedY;
            this.x += this.speedX;
            if (this.y < 0) {
                this.y = canvas.height;
                this.x = Math.random() * canvas.width;
            }
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
        }
        draw() {
            ctx.fillStyle = document.body.classList.contains('light-mode') 
                ? `rgba(14, 165, 233, ${this.opacity * 0.5})` 
                : `rgba(0, 219, 233, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    
    function initParticles() {
        particles = [];
        const numParticles = Math.floor((canvas.width * canvas.height) / 10000); // Dynamic count
        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }
    }
    
    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateParticles);
    }
    
    initParticles();
    animateParticles();
</script>
</body>
</html>
